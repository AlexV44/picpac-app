<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e2575a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PicPac">
<title>PicPac</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="/img/logo-white.png" alt="" width="260" height="138"><i></i></div>
<div id="stage">
  <div id="app" data-screen="welcome">
    <header id="top"></header>
    <main id="view" tabindex="-1"></main>
    <nav id="nav" aria-label="Основная навигация">
      <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5.5v-6h-5v6H4Z"/></svg><span>Главная</span></button>
      <button data-tab="photos"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 8"/></svg><span>Фото</span></button>
      <button data-tab="projects"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/></svg><span>Проекты</span></button>
      <button data-tab="cart"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10l2-8H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg><span>Корзина</span><i id="cart-badge" hidden></i></button>
    </nav>

    <div id="amenu" hidden></div>
    <button id="fab" aria-label="Робот-помощник" hidden></button>
    <div id="fab-hint" hidden>Спросите меня, как изменить альбом</div>
    <section id="chat" hidden role="dialog" aria-label="Робот-помощник">
      <div class="ch-hd"><span id="ch-ava"></span><div class="ch-t"><b>Робот-помощник</b><small>Меняю альбом по вашим словам</small></div>
        <button class="ch-x" data-act="chat-close" aria-label="Закрыть">✕</button></div>
      <div id="ctxbar" hidden></div>
      <div id="msgs"></div>
      <div id="chips" class="chips"></div>
      <form id="cbar"><input id="cin" placeholder="Что изменить? Например: оформи в стиле Хэллоуин" autocomplete="off">
        <button id="csend" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
    </section>

    <div id="pill" hidden><div class="spin"></div><span id="pill-t">ИИ работает…</span></div>
    <div id="toast" hidden role="status" aria-live="polite"></div>
    <div id="push" hidden role="status" aria-live="polite" tabindex="0"></div>
    <div id="offline" hidden role="alert">Нет сети. Ваши данные не потеряны: черновик сохранён, заказ не задвоится при повторной отправке.</div>
    <div id="sheet-bg" hidden></div>
    <div id="sheet" hidden role="dialog" aria-modal="true" aria-label="Окно действий"></div>
    <div id="full" hidden></div>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="/i18n.js"></script>
<script src="/mascots.js"></script>
<script src="/icons.js"></script>
<script src="/app.js"></script>
</body>
</html>
